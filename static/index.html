<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Копилка</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">

    <!-- Левая панель: баланс и категории -->
    <aside class="sidebar">
      <h1 class="logo">Копилка</h1>
      <div class="balance-label">Баланс</div>
      <div class="balance" id="balance">0,00 ₽</div>

      <section class="categories">
        <h2 class="side-title">Категории</h2>

        <div class="cat-group-title">Расходы</div>
        <ul class="cat-list" id="cats-expense"></ul>

        <div class="cat-group-title">Доходы</div>
        <ul class="cat-list" id="cats-income"></ul>

        <!-- Одна форма для создания и для изменения категории -->
        <form id="cat-form" class="cat-form" novalidate>
          <div class="cat-form-title" id="cat-form-title">Новая категория</div>
          <input type="text" id="cat-name" maxlength="30" placeholder="Название" autocomplete="off">
          <div class="cat-row">
            <select id="cat-type">
              <option value="expense">Расход</option>
              <option value="income">Доход</option>
            </select>
            <input type="color" id="cat-color" value="#1a73e8" title="Цвет">
          </div>
          <div class="cat-error" id="cat-error"></div>
          <div class="cat-buttons">
            <button type="submit" class="btn btn-small" id="cat-submit">Добавить</button>
            <button type="button" class="btn btn-small btn-danger" id="cat-delete" hidden>Удалить</button>
            <button type="button" class="btn btn-small btn-secondary" id="cat-cancel" hidden>Отмена</button>
          </div>
        </form>
      </section>
    </aside>

    <!-- Центр: список операций -->
    <main class="content">
      <h2>Операции</h2>
      <div id="list-error" class="form-error" hidden></div>
      <div id="operations"></div>
      <div id="empty" class="empty" hidden>
        <p>Пока нет операций</p>
        <button type="button" id="add-first" class="btn">Добавить первую операцию</button>
      </div>
    </main>

    <!-- Правая панель: форма добавления / редактирования операции -->
    <section class="form-panel">
      <h2 id="form-title">Новая операция</h2>
      <form id="op-form" novalidate>
        <div class="type-switch">
          <label><input type="radio" name="type" value="expense" checked> Расход</label>
          <label><input type="radio" name="type" value="income"> Доход</label>
        </div>

        <div class="field">
          <label for="amount">Сумма, ₽</label>
          <input type="text" id="amount" inputmode="decimal" placeholder="Например, 2500,50" autocomplete="off">
          <div class="field-error" id="amount-error"></div>
        </div>

        <div class="field">
          <label for="date">Дата</label>
          <input type="date" id="date">
          <div class="field-error" id="date-error"></div>
        </div>

        <div class="field">
          <label for="category">Категория</label>
          <select id="category"></select>
          <div class="field-error" id="categoryId-error"></div>
        </div>

        <div class="field">
          <label for="comment">Комментарий</label>
          <input type="text" id="comment" maxlength="200" placeholder="Необязательно">
          <div class="field-error" id="comment-error"></div>
        </div>

        <div class="form-error" id="form-error"></div>
        <div class="form-buttons">
          <button type="submit" class="btn" id="op-submit">Добавить</button>
          <button type="button" class="btn btn-secondary" id="op-cancel" hidden>Отмена</button>
        </div>
      </form>
    </section>

  </div>

  <!-- Окно подтверждения удаления (внутри страницы, не браузерный confirm) -->
  <dialog id="confirm-dialog" class="dialog">
    <p id="confirm-text"></p>
    <div class="dialog-buttons">
      <button type="button" class="btn btn-danger" id="confirm-ok">Удалить</button>
      <button type="button" class="btn btn-secondary" id="confirm-cancel">Отмена</button>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
